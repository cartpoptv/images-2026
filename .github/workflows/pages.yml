name: Publish
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Write manifest.json and index.html, publish everything on the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GO_VERSION: go1.27.1
          GO_SHA256: 63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          curl -fsSLo "$RUNNER_TEMP/go.tar.gz" "https://go.dev/dl/${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  $RUNNER_TEMP/go.tar.gz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/go/bin/go" run .github/pages.go
          touch .nojekyll
          git checkout -q --orphan gh-pages
          git add -A -f
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish ${GITHUB_SHA}"
          git push -q -f origin gh-pages
